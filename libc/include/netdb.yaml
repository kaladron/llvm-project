    standards:
      - posix
    return_type: struct protoent *
    arguments:
      - type: const char *
  - name: getprotobyname_r
    standards:
      - gnu
    return_type: int
    arguments:
      - type: const char *__restrict
      - type: struct protoent *__restrict
      - type: char *__restrict
      - type: size_t
      - type: struct protoent **__restrict
  - name: getprotobynumber
    standards:
      - posix
    return_type: struct protoent *
    arguments:
