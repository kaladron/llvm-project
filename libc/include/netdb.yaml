  - name: __h_errno_location
    standards:
      - gnu
    return_type: int *
    arguments:
      - type: void
  - name: freeaddrinfo
    standards:
      - posix
    return_type: void
    arguments:
      - type: struct addrinfo *
  - name: gai_strerror
    standards:
      - posix
    return_type: const char *
    arguments:
      - type: int
  - name: getaddrinfo
    standards:
      - posix
    return_type: int
    arguments:
      - type: const char *__restrict
      - type: const char *__restrict
      - type: const struct addrinfo *__restrict
      - type: struct addrinfo **__restrict
  - name: getnetbyaddr
    standards:
      - posix
    return_type: struct netent *
    arguments:
      - type: uint32_t
      - type: int
  - name: getnetbyaddr_r
    standards:
      - gnu
    return_type: int
    arguments:
      - type: uint32_t
      - type: int
      - type: struct netent *__restrict
      - type: char *__restrict
      - type: size_t
      - type: struct netent **__restrict
      - type: int *__restrict
