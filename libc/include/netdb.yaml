  - macro_name: EAI_AGAIN
    macro_header: netdb-macros.h
  - macro_name: EAI_BADFLAGS
    macro_header: netdb-macros.h
  - macro_name: EAI_FAIL
    macro_header: netdb-macros.h
  - macro_name: EAI_FAMILY
    macro_header: netdb-macros.h
  - macro_name: EAI_MEMORY
    macro_header: netdb-macros.h
  - macro_name: EAI_NONAME
