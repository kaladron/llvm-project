  - macro_name: HOST_NOT_FOUND
    macro_header: netdb-macros.h
  - macro_name: TRY_AGAIN
    macro_header: netdb-macros.h
  - macro_name: NO_RECOVERY
    macro_header: netdb-macros.h
  - macro_name: NO_DATA
    macro_header: netdb-macros.h
  - macro_name: NO_ADDRESS
    macro_header: netdb-macros.h
  - macro_name: h_errno
    macro_header: netdb-macros.h
types:
  - type_name: in_port_t
  - type_name: size_t
  - type_name: struct_addrinfo
  - type_name: struct_netent
  - type_name: struct_protoent
  - type_name: struct_servent
